<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fef6e4">
  <title>Retos en familia</title>
  <link rel="stylesheet" href="css/retos.css?v=6">
</head>
<body>

<header class="bar">
  <span class="back spacer" aria-hidden="true"></span>
  <div class="bar-title">
    <strong id="barTitle">Retos en familia</strong>
    <span id="barSub" class="code" hidden></span>
  </div>
  <button id="meBtn" class="me" hidden aria-label="Mi perfil"></button>
</header>

<nav id="tabs" class="tabs" hidden>
  <button data-tab="retos">🎯<span>Retos</span></button>
  <button data-tab="usuarios">👥<span>Usuarios</span></button>
  <button data-tab="admin">🛡️<span>Administrador</span></button>
</nav>

<div id="offline" class="offline" hidden>Sin conexión… reintentando</div>

<main id="app" aria-live="polite"></main>

<!-- Cámara en vivo -->
<div id="camera" class="camera-ov" hidden>
  <div class="cam-top"><span id="camTitle"></span><button id="camClose" class="cam-round" aria-label="Cerrar cámara">✕</button></div>
  <div id="camLive" class="cam-stage">
    <video id="camVideo" autoplay playsinline muted></video>
    <p id="camMsg" class="cam-msg" hidden></p>
    <div class="cam-bar">
      <span class="cam-side"></span>
      <button id="camShutter" class="cam-shutter" aria-label="Hacer foto" disabled></button>
      <button id="camFlip" class="cam-round" aria-label="Cambiar de cámara">🔄</button>
    </div>
  </div>
  <div id="camPreview" class="cam-stage" hidden>
    <img id="camImg" alt="Foto que acabas de hacer">
    <div class="cam-bar">
      <button id="camRetake" class="btn ghost-dark">↺ Repetir</button>
      <button id="camUse" class="btn primary">✅ Usar foto</button>
    </div>
  </div>
</div>

<!-- Visor de foto -->
<div id="viewer" class="viewer" hidden>
  <img id="viewerImg" alt="">
  <div class="viewer-info"><span id="viewerCaption"></span></div>
  <div class="viewer-actions">
    <button id="viewerDelete" class="btn danger" hidden>🗑️ No aplica: borrar foto</button>
    <button id="viewerClose" class="btn">Cerrar</button>
  </div>
</div>

<!-- Celebración -->
<div id="party" class="party" hidden>
  <div class="party-box">
    <div class="party-emoji" id="partyEmoji">🏆</div>
    <h2 id="partyTitle"></h2>
    <p id="partyText"></p>
    <button class="btn primary" id="partyClose">¡Genial!</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/vendor/supabase-2.45.4.js"></script>
<script src="js/retos-config.js?v=3"></script>
<script src="js/retos.js?v=6"></script>
</body>
</html>
